name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: The tag matches both versions and create-kasbah's dependency
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in package.json create/package.json; do
            v=$(node -p "require('./$p').version")
            [ "$v" = "$tag" ] || { echo "$p is $v, the release is $tag"; exit 1; }
          done
          d=$(node -p "require('./create/package.json').dependencies.kasbah")
          [ "$d" = "^$tag" ] || { echo "create-kasbah depends on kasbah $d, not ^$tag"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: npm install -g npm@12
      - run: npm stage publish . --access public --provenance
      - run: npm stage publish . --access public --provenance
        working-directory: create
